<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRS - AI Resume Screener</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>AIRS</h1>
    <p>Automated Intelligence for Resume Screening</p>
</header>

<div class="container">

    <div class="form-group">
        <label>Upload Resume (PDF or TXT)</label>
        <input type="file" id="resumeFile" accept=".pdf,.txt">
    </div>

    <div class="form-group">
        <label>Job Description</label>
        <textarea id="job" placeholder="Paste the job description here..."></textarea>
    </div>

    <button onclick="analyze()" id="analyzeBtn">Analyze Resume</button>

    <div id="loader" style="display:none;">
        <p>⏳ Analyzing resume... please wait</p>
    </div>

    <div id="result-box" style="display:none;">

        <div class="score-section">
            <h2 id="score-value">0%</h2>
            <p id="verdict-value">-</p>
        </div>

        <div class="section">
            <h3>✅ Matched Skills</h3>
            <ul id="matched-skills"></ul>
        </div>

        <div class="section">
            <h3>❌ Missing Skills</h3>
            <ul id="missing-skills"></ul>
        </div>

        <div class="section">
            <h3>💡 Improvement Tips</h3>
            <ul id="improvement-tips"></ul>
        </div>

    </div>

    <div id="error-box" style="display:none;">
        <p id="error-msg"></p>
    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
